<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="task_tracker_with_badges.css">
</head>
<body>
<header class="py-4 bg-primary text-white">
  <div class="container d-flex flex-wrap gap-3 justify-content-between align-items-center">
    <div>
      <h1 class="h3 mb-1">Task Tracker</h1>
      <p class="mb-0 text-white-50">Focus on the next useful action.</p>
    </div>
    <div>
      <span class="badge text-bg-light fs-6">Pending: <span class="badge text-bg-primary">5</span></span>
    </div>
  </div>
</header>

<main class="container py-5">
  <section class="mx-auto tracker-shell">
    <h2 class="h4 fw-bold mb-4">Today's tasks</h2>

    <!-- Bootstrap list-group organizes tasks into clean rows -->
    <div class="list-group shadow-sm">
      <div class="list-group-item d-flex justify-content-between align-items-center gap-3">
        <span>Finish landing page wireframe</span>
        <span class="badge text-bg-danger">High</span>
      </div>
      <div class="list-group-item d-flex justify-content-between align-items-center gap-3">
        <span>Review pull request</span>
        <span class="badge text-bg-warning">Medium</span>
      </div>
      <div class="list-group-item d-flex justify-content-between align-items-center gap-3">
        <span>Organize project notes</span>
        <span class="badge text-bg-success">Low</span>
      </div>
      <div class="list-group-item d-flex justify-content-between align-items-center gap-3">
        <span>Prepare demo slides</span>
        <span class="badge text-bg-danger">High</span>
      </div>
      <div class="list-group-item d-flex justify-content-between align-items-center gap-3">
        <span>Send weekly summary</span>
        <span class="badge text-bg-warning">Medium</span>
      </div>
    </div>

    <button class="btn btn-outline-success mt-4">
      Completed <span class="badge text-bg-success ms-1">3</span>
    </button>
  </section>
</main>

<footer class="py-4 border-top text-center text-secondary">
  <p class="mb-0">Keep moving one task at a time.</p>
</footer>
</body>
</html>
